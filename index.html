<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeateam Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
<header>
  <div class="logo">
    <img src="Yteamlogo.png" alt="Yeateam Studio Logo">
  </div>
<div class="promo">
    <img src="Yteam.jpg" alt="Promo Baju" class="promo-img">

    <div class="promo-text">
      <h1 class="special-heading">GAK LENGKAP TAPI TEGAP</h1>
      <p>Jangan Lewatkan Baju Batch 1 Dari Yeateam Studio</p>
    </div>

    <button id="orderBtn" class="wa-button">
      <img src="Whatsapp.jpg" alt="WhatsApp" class="wa-icon">
      Pesan Sekarang
    </button>
  </div>
</header>

  <!-- Scrollable Gallery -->
 <!-- Scrollable Gallery jadi slideshow -->
<section class="gallery">
  <div class="scroll-container" id="slideshow">
    <div class="slide">
      <img src="Catalog.jpeg" alt="Catalog">
      <img src="Article.jpeg" alt="Article">
      <img src="aboutus.jpeg" alt="About Us">
    </div>
    <div class="slide">
      <img src="Catalog.jpeg" alt="Next">
      <img src="Article.jpeg" alt="Next">
      <img src="aboutus.jpeg" alt="Next">
    </div>
    <!-- Tambahkan slide lain sesuai kebutuhan -->
  </div>
  <button class="prev">&#10094;</button>
  <button class="next">&#10095;</button>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</section>

<section class="info-section">

  <div class="ranking-box">
    <h2>🏆 TOP</h2>
    <p>#1 Trending</p>
  </div>

  <div class="barcode-box">
    <img src="barcode.png" alt="Barcode">
    <p>Feedback</p>
  </div>

</section>



  <!-- Footer -->
<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-column">
      <h3>Yeateam Studio</h3>
      <p>Brand fashion lokal dengan desain unik dan tegas.</p>
    </div>


    <div class="footer-column">
      <h3>Ikuti Kami</h3>
      <div class="social-icons">
        <a href="https://instagram.com/yeateamstudio" target="_blank">Instagram</a>
        <a href="https://wa.me/6285219577718" target="_blank">WhatsApp</a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; 2026 Yeateam Studio. All Rights Reserved.</p>
    <button id="scrollTopBtn">↑ Kembali ke atas</button>
  </div>
</footer>


  <script src="script.js"></script>
</body>
</html>
