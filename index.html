<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeateam Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
<header>
  <div class="logo">
    <img src="logo.png" alt="Yeateam Studio Logo">
  </div>
    <img src="promo1.png" alt="Promo Baju">
    <div class="promo-text">
      <h1>GAK LENGKAP TAPI TEGAP</h1>
      <p>Jangan Lewatkan Baju Batch 1 Dari Yeateam Studio</p>
      <button id="orderBtn">
        <img src="whatsapp.png" alt="WhatsApp" class="wa-icon">
        Pesan Sekarang
      </button>
    </div>
  </div>
</header>


  <!-- Scrollable Gallery -->
 <!-- Scrollable Gallery jadi slideshow -->
<section class="gallery">
  <div class="scroll-container" id="slideshow">
    <img src="Yteam.jpg" alt="Catalog">
    <img src="Yteam.jpg" alt="Article">
    <img src="Yteam.jpg" alt="About Us">
  </div>
  <button class="prev">&#10094;</button>
  <button class="next">&#10095;</button>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</section>


  <!-- Footer -->
  <footer>
    <a href="https://instagram.com/yeateamstudio" target="_blank">Instagram</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
