<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeateam Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
<header>
  <div class="logo">
    <img src="Yteamlogo.jpeg" alt="Yeateam Studio Logo">
  </div>
<div class="promo">
    <img src="Yteam.jpg" alt="Promo Baju" class="promo-img">

    <div class="promo-text">
      <h1 class="special-heading">GAK LENGKAP TAPI TEGAP</h1>
      <p>Jangan Lewatkan Baju Batch 1 Dari Yeateam Studio</p>
    </div>

    <button id="orderBtn" class="wa-button">
      <img src="Whatsapp.jpg" alt="WhatsApp" class="wa-icon">
      Pesan Sekarang
    </button>
  </div>
</header>

  <!-- Scrollable Gallery -->
 <!-- Scrollable Gallery jadi slideshow -->
<section class="gallery">
  <div class="scroll-container" id="slideshow">
    <div class="slide">
      <img src="Yteam.jpg" alt="Catalog">
      <img src="Yteam2.jpg" alt="Article">
      <img src="Yteam3.jpg" alt="About Us">
    </div>
    <div class="slide">
      <img src="Yteam.jpg" alt="Next">
      <img src="Yteam.jpg" alt="Next">
      <img src="Yteam.jpg" alt="Next">
    </div>
    <!-- Tambahkan slide lain sesuai kebutuhan -->
  </div>
  <button class="prev">&#10094;</button>
  <button class="next">&#10095;</button>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</section>


  <!-- Footer -->
  <footer>
    <a href="https://instagram.com/yeateamstudio" target="_blank">Instagram</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
